# AI-Generated Compose file
# Flaw 1: Missing named volume -> data is wiped whenever container is removed!
# Flaw 2: Hardcoded credentials instead of using environment configuration
# Flaw 3: Missing database healthcheck on db service

version: "3.8"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://postgres:dev@db:5432/tasks
    depends_on:
      - db

  db:
    image: postgres:latest
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: tasks
    ports:
      - "5432:5432"
    # Notice: NO volume defined, so tasks vanish on restart!
